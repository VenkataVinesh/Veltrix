name: CI

# Single Next.js app, so there is nothing left to path-filter against. The
# previous filter listed only app/, components/, lib/ and package.json, which
# meant a change to middleware.ts, tsconfig.json or a workflow shipped without
# ever being type-checked or built.
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
